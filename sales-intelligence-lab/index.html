<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Intelligence Lab: The Enterprise Discovery Challenge</title>
  <meta name="description" content="An interactive enterprise sales enablement simulation: discovery, stakeholder intelligence, value propositions, and objection handling.">
  <meta name="theme-color" content="#F7F9FC">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23183153'/%3E%3Ccircle cx='11' cy='12' r='4' fill='%232563EB'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%230D9488'/%3E%3Ccircle cx='19' cy='22' r='4' fill='%237C3AED'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#183153"/>
          <path d="M11 12 L22 10 L19 22 Z" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/>
          <circle cx="11" cy="12" r="3.6" fill="#5B8CFF"/>
          <circle cx="22" cy="10" r="2.8" fill="#2DD4BF"/>
          <circle cx="19" cy="22" r="3.6" fill="#A78BFA"/>
        </svg>
        <div class="brand-text">
          <p class="brand-title">Sales Intelligence Lab</p>
          <p class="brand-sub">The Enterprise Discovery Challenge</p>
        </div>
      </div>
      <nav class="stepper" aria-label="Simulation stages">
        <ol id="stepper"></ol>
      </nav>
      <div class="topbar-actions">
        <button type="button" class="btn btn-tool" id="btn-rules">
          <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.5h12v13H4z"/><path d="M7 7h6M7 10h6M7 13h3"/></svg>
          <span>Scoring rules</span></button>
        <button type="button" class="btn btn-tool" id="btn-reset">
          <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.7-4"/><path d="M4.5 3.5V7H8"/></svg>
          <span>Start over</span></button>
      </div>
    </div>
    <div class="progress" id="progress" role="img" aria-label="0 of 4 stages complete"></div>
  </header>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="shell">
    <main id="main" class="workspace" tabindex="-1"></main>
    <aside class="dealroom" id="dealroom" aria-label="Deal room: account intelligence gathered so far"></aside>
  </div>

  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <dialog id="dlg-rules" class="dialog" aria-labelledby="dlg-rules-title">
    <div class="dialog-body" id="rules-body"></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-primary" data-close>Close</button>
    </div>
  </dialog>

  <dialog id="dlg-reset" class="dialog dialog-sm" aria-labelledby="dlg-reset-title">
    <div class="dialog-body">
      <h2 id="dlg-reset-title">Start over?</h2>
      <p>This clears every answer and score so you can run the simulation again from the beginning.</p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-close>Keep my progress</button>
      <button type="button" class="btn btn-danger" id="btn-reset-confirm">Start over</button>
    </div>
  </dialog>

  <noscript><p class="noscript">This simulation needs JavaScript enabled to run.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
